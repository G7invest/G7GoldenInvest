<!doctype html>
<html lang="pt-BR" data-i18n-title="auth_forgot_title">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1020" />
  <title>Recuperar Senha | G7 Gold Invest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../public/logo/logo_g7-bola.svg" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="./auth-common.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" role="main">

      <div class="auth-lang-top">
        <select class="select-lang auth-lang" aria-label="Idioma"></select>
      </div>

      <a href="../index.html" class="auth-brand">
        <img class="ball"  src="../public/logo/logo_g7-bola.svg" alt="Logo G7" />
        <img class="name"  src="../public/logo/logo_g7-nome.png" alt="G7 Gold Invest" onerror="this.style.display='none'"/>
      </a>

      <header class="auth-head">
        <h1 class="auth-title" data-i18n="auth_forgot_title">Recuperar Senha</h1>
        <p class="auth-sub" data-i18n="auth_forgot_subtitle">Digite seu email para receber um link</p>
      </header>

      <div id="alerts"></div>

      <form id="formForgot" novalidate>
        <div class="field">
          <label for="email" data-i18n="auth_label_email">E-mail</label>
          <div class="input-wrap">
            <input id="email" name="email" type="email" class="email" autocomplete="email"
              placeholder="voce@email.com" data-i18n-ph="auth_ph_email" required />
          </div>
          <div class="err" id="err-email"></div>
        </div>

        <button type="submit" class="btn-submit" data-i18n="auth_btn_send_link">Enviar Link de Recuperação</button>

        <p class="links-row center" style="margin-top: 16px;">
          <a href="./login.html" data-i18n="auth_btn_back_login">← Voltar para o login</a>
        </p>
      </form>
    </section>
  </main>

  <script src="./auth-common.js"></script>
  <script>
    AuthCommon.boot(function (h) {
      var $ = function (id) { return document.getElementById(id); };
      $('formForgot').addEventListener('submit', function (e) {
        e.preventDefault();
        h.clearAllErrors();
        var v = $('email').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
          h.setFieldError('email', authService ? authService._t('auth_invalid_email') : 'Email inválido'); return;
        }
        h.setBtnLoading($('formForgot').querySelector('.btn-submit'), true);
        (authService ? authService.doForgot(v) : Promise.resolve({ok:true, message:'ok'}))
          .then(function (r) {
            h.setBtnLoading($('formForgot').querySelector('.btn-submit'), false);
            if (!r.ok) {
              if (r.errors) Object.keys(r.errors).forEach(function (k){
                if (k==='_global') h.setGlobalAlert(r.errors[k], 'error');
                else h.setFieldError(k, r.errors[k]);
              });
              return;
            }
            var msg = r.message || (authService ? authService._t('auth_forgot_sent',{email:v}) : 'Link enviado');
            h.setGlobalAlert(msg, 'success');
            h.showToast(msg, 'success');
          }).catch(function (err) {
            h.setBtnLoading($('formForgot').querySelector('.btn-submit'), false);
            h.setGlobalAlert(String(err && err.message ? err.message : err));
          });
      });
    });
  </script>
</body>
</html>
