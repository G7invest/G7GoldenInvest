<!doctype html>
<html lang="pt-BR" data-i18n-title="auth_reset_title">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1020" />
  <title>Redefinir Senha | G7 Gold Invest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../public/logo/logo_g7-bola.svg" />
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="./auth-common.css" />
</head>
<body>
  <main class="auth-wrap">
    <section class="auth-card" role="main">

      <div class="auth-lang-top">
        <select class="select-lang auth-lang" aria-label="Idioma"></select>
      </div>

      <a href="../index.html" class="auth-brand">
        <img class="ball"  src="../public/logo/logo_g7-bola.svg" alt="Logo G7" />
        <img class="name"  src="../public/logo/logo_g7-nome.png" alt="G7 Gold Invest" onerror="this.style.display='none'"/>
      </a>

      <header class="auth-head">
        <h1 class="auth-title" data-i18n="auth_reset_title">Redefinir Senha</h1>
        <p class="auth-sub" data-i18n="auth_reset_subtitle">Crie uma nova senha forte</p>
      </header>

      <div id="alerts"></div>

      <form id="formReset" method="POST" action="javascript:void(0);" novalidate>
        <div class="field">
          <label for="password" data-i18n="auth_label_password">Nova Senha</label>
          <div class="input-wrap" data-eye>
            <input id="password" name="password" type="password" autocomplete="new-password"
              placeholder="Mínimo 6 caracteres" data-i18n-ph="auth_ph_password" required minlength="6" />
            <button type="button" class="eye" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="err" id="err-password"></div>
        </div>

        <div class="field">
          <label for="confirmPassword" data-i18n="auth_label_confirm_password">Confirmar Nova Senha</label>
          <div class="input-wrap" data-eye>
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
              placeholder="Digite a senha novamente" data-i18n-ph="auth_ph_confirm_password" required minlength="6" />
            <button type="button" class="eye" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="err" id="err-confirmPassword"></div>
        </div>

        <button type="submit" class="btn-submit" data-i18n="auth_btn_reset_password">Alterar Senha</button>

        <p class="links-row center" style="margin-top: 16px;">
          <a href="./login.html" data-i18n="auth_btn_back_login">← Voltar para o login</a>
        </p>
      </form>
    </section>
  </main>

  <script src="./auth-common.js?v=14092026-1840"></script>
  <script>
    AuthCommon.boot(function (h) {
      var $ = function (id) { return document.getElementById(id); };
      // precisa que o SDK tenha resgatado recovery token (usuário chegou aqui via email link)
      if (SupabaseService && SupabaseService.client && SupabaseService.client.auth) {
        SupabaseService.client.auth.getSession().catch(function(){});
      }

      $('formReset').addEventListener('submit', function (e) {
        e.preventDefault();
        h.clearAllErrors();
        var p1 = $('password').value;
        var p2 = $('confirmPassword').value;
        var errs = {};
        if (!p1 || p1.length < 6) errs.password = authService ? authService._t('auth_password_min',{n:6}) : 'Senha inválida';
        if (p1 !== p2) errs.confirmPassword = authService ? authService._t('auth_passwords_not_match') : 'Senhas não conferem';
        if (Object.keys(errs).length) { Object.keys(errs).forEach(function(k){ h.setFieldError(k, errs[k]); }); return; }
        h.setBtnLoading($('formReset').querySelector('.btn-submit'), true);
        (authService ? authService.doResetPassword(p1,p2) : Promise.resolve({ok:true}))
          .then(function (r) {
            h.setBtnLoading($('formReset').querySelector('.btn-submit'), false);
            if (!r.ok) {
              if (r.errors) Object.keys(r.errors).forEach(function(k){
                if (k==='_global') h.setGlobalAlert(r.errors[k],'error'); else h.setFieldError(k, r.errors[k]);
              });
              return;
            }
            var msg = r.message || (authService ? authService._t('auth_reset_done') : 'Senha alterada ✓');
            h.setGlobalAlert(msg, 'success');
            h.showToast(msg, 'success');
            setTimeout(function(){ location.href = '/index.html'; }, 1200);
          })
          .catch(function (err) {
            h.setBtnLoading($('formReset').querySelector('.btn-submit'), false);
            h.setGlobalAlert(String(err && err.message ? err.message : err));
          });
      });
    });
  </script>
</body>
</html>
